# ============================================================
# ContractScan Docker Compose
# Usage:
#   1. cp backend/.env.example backend/.env   (then edit it)
#   2. docker-compose up -d
# ============================================================

services:
  contractscan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contractscan
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./backend/.env:/app/.env:ro
    restart: unless-stopped
